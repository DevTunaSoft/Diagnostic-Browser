name: Public source safety
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  source-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check prohibited vendor identifiers and sensitive artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('.')
          banned=re.compile('trau'+'ma[\\W_]*so'+'ft|midwest'+'medical|mmt'+'amb',re.I)
          secret=re.compile(r'(?i)(?:api[_-]?key|secret|password|access[_-]?token)\s*[:=]\s*[\x22\x27][^\x22\x27]{8,}')
          ignored={'.git'}
          failures=[]
          for p in root.rglob('*'):
              if not p.is_file() or any(x in ignored for x in p.parts):continue
              if p.suffix.lower() in {'.exe','.dll','.db','.sqlite','.gguf','.onnx','.pfx','.p12','.pem','.key'}:failures.append(f'Forbidden artifact: {p}')
              if p.stat().st_size>2_000_000:continue
              try:s=p.read_text(encoding='utf-8')
              except (UnicodeError,OSError):continue
              if banned.search(s):failures.append(f'Prohibited identifier: {p}')
              if secret.search(s):failures.append(f'Potential credential: {p}')
          if failures:
              print('\n'.join(failures));sys.exit(1)
          print('Public-source checks passed')
          PY
