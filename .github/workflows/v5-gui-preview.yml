name: V5 Integrated GUI Windows Acceptance
on:
  push:
    branches: [feature/v5-integrated-gui-build]
    paths:
      - 'diagnostic_browser/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/v5-gui-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and verify source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m compileall -q diagnostic_browser
          if ($LASTEXITCODE -ne 0) { throw 'Source compilation failed' }
      - name: Run full existing Windows engineering acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\finish_on_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Full Windows engineering acceptance failed' }
      - name: Explicitly block disconnected GUI release
        shell: pwsh
        run: |
          $source=Get-Content diagnostic_browser/desktop_preview.py -Raw
          if ($source -match 'not connected|not instrumented') {
            throw 'RELEASE BLOCKED: embedded browser diagnostics are not integrated. A preview EXE is not an install-ready product.'
          }
          throw 'RELEASE BLOCKED: no independent embedded-browser recorder integration and installer acceptance evidence is configured.'
      # No artifact upload. Release must remain blocked until the integrated
      # browser/recorder, real Windows runtime, installer and regression gates pass.
