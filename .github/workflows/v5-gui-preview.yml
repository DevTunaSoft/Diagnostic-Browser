name: V5 Integrated GUI Windows Preview
on:
  push:
    branches: [feature/v5-integrated-gui-build]
    paths:
      - 'diagnostic_browser/desktop_preview.py'
      - '.github/workflows/v5-gui-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-gui-preview:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop build dependencies
        run: python -m pip install --upgrade pip PySide6 pyinstaller
      - name: Compile and smoke-import GUI module
        shell: pwsh
        run: |
          python -m py_compile diagnostic_browser/desktop_preview.py
          python -c "import diagnostic_browser.desktop_preview as gui; assert callable(gui.main); print('GUI import PASS')"
      - name: Build Windows desktop preview EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DiagnosticBrowserV5Preview --collect-all PySide6 --hidden-import PySide6.QtWebEngineWidgets diagnostic_browser/desktop_preview.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
      - name: Validate EXE artifact
        shell: pwsh
        run: |
          $exe='dist/DiagnosticBrowserV5Preview.exe'
          if (-not (Test-Path $exe)) { throw "Executable missing" }
          $file=Get-Item $exe
          if ($file.Length -lt 1000000) { throw "Executable suspiciously small" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Write-Host "Build artifact exists; interactive Windows GUI runtime and browser-to-recorder integration NOT verified."
      - name: Upload unsigned preview
        uses: actions/upload-artifact@v4
        with:
          name: DiagnosticBrowserV5-GUI-Windows-Preview
          path: dist/DiagnosticBrowserV5Preview.exe
          if-no-files-found: error
          retention-days: 7
